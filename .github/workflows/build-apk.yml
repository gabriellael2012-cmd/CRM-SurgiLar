name: Gerar APK Android - CRM Kely Alves

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Frontend Vite
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Permissão de Execução no Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew || true

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Salvar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Kely-Alves-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
